<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Something For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== COLORS ===== */
  :root {
    --blush: #f8d7dd; --blush-deep: #efa7b6; --cream: #fff8ee; --white: #fff;
    --red: #d1495f; --green: #8fae8b; --ink: #6b3a45;
    --script: "Dancing Script", "Brush Script MT", cursive;
    --hand: "Caveat", "Segoe Print", cursive;
    --clean: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--clean); color: var(--ink); min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
    background: radial-gradient(circle at 15% 10%, #fff3f4 0, transparent 45%),
                radial-gradient(circle at 90% 90%, #fde4e9 0, transparent 50%), var(--blush);
  }
  button { font-family: var(--clean); cursor: pointer; }
  button:focus-visible, .envelope:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .hidden { display: none !important; }

  /* ===== FLOWERS (SVG, reused everywhere) ===== */
  .plant {
    position: relative; height: 100%; width: auto; overflow: visible;
    transform-origin: 50% 100%;
    scale: .55; rotate: 0deg;                       /* closed buds at first */
    transition: scale 2s cubic-bezier(.2,.8,.3,1) var(--d, 0s);
    animation: sway 6s ease-in-out infinite var(--d, 0s);
  }
  body.bloom .plant { scale: 1; }
  .plant .head { transform-box: fill-box; transform-origin: center; scale: .55; transition: scale 2.4s ease var(--d, 0s); animation: breathe 5s ease-in-out infinite; }
  body.bloom .plant .head { scale: 1; }
  .plant.still { scale: 1; animation: none; transition: none; }
  .plant.still .head { scale: 1; animation: none; transition: none; }
  @keyframes sway    { 0%,100% { rotate: -2.5deg; } 50% { rotate: 2.5deg; } }
  @keyframes breathe { 0%,100% { translate: 0 0; } 50% { translate: 0 -2px; } }

  .garden { position: fixed; left: 0; right: 0; bottom: 0; height: clamp(110px, 24vh, 190px); display: flex; justify-content: space-around; align-items: flex-end; pointer-events: none; z-index: 0; padding: 0 2%; }
  .garden .plant:nth-child(even) { height: 78%; }
  .garden .plant:nth-child(3n) { height: 62%; }

  /* Falling petals */
  #petals { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .petal { position: absolute; top: -30px; background: var(--blush-deep); border-radius: 150% 0 150% 0; opacity: 0; animation: fall linear forwards; }
  @keyframes fall {
    0% { transform: translate(0,0) rotate(0); opacity: 0; } 10% { opacity: .85; }
    50% { transform: translate(40px, 55vh) rotate(180deg); } 
    100% { transform: translate(-30px, 112vh) rotate(380deg); opacity: 0; }
  }
  .heart { position: absolute; bottom: -30px; color: var(--red); opacity: 0; animation: rise linear forwards; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-105vh) translateX(25px); opacity: 0; } }
  .sparkle { position: fixed; color: #fff; pointer-events: none; z-index: 0; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

  main { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 70px 18px 24px; }

  /* ===== OPENING SCREEN ===== */
  #intro { text-align: center; width: 100%; max-width: 460px; }
  #intro h1 { font-family: var(--script); font-size: clamp(2.1rem, 8vw, 3rem); color: var(--red); }
  #intro .sub { font-family: var(--hand); font-size: 1.6rem; margin-bottom: 40px; }
  .envelope-wrap { position: relative; perspective: 900px; width: min(300px, 76vw); margin: 0 auto 34px; }
  .side-flower { position: absolute; bottom: -14px; height: 150px; z-index: 5; pointer-events: none; }
  .side-flower.l { left: -54px; } .side-flower.r { right: -54px; }
  .envelope { position: relative; width: 100%; aspect-ratio: 3 / 2; background: #ee9fb0; border-radius: 6px 6px 12px 12px; box-shadow: 0 20px 36px rgba(209,73,95,.25); cursor: pointer; animation: bob 4.5s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .envelope.open { animation: none; }
  .env-letter { position: absolute; left: 7%; right: 7%; top: 6%; height: 82%; background: var(--cream); border-radius: 8px; z-index: 1; display: grid; place-items: center; font-family: var(--script); color: var(--red); font-size: 1.4rem; transition: transform 1.1s ease .5s; box-shadow: 0 -2px 8px rgba(0,0,0,.06); }
  .envelope.open .env-letter { transform: translateY(-64%); }
  .env-front { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .env-front::before, .env-front::after { content: ""; position: absolute; top: 0; bottom: 0; width: 56%; background: #f6bdc9; }
  .env-front::before { left: 0; clip-path: polygon(0 0, 100% 55%, 0 100%); border-radius: 6px 0 0 12px; }
  .env-front::after { right: 0; clip-path: polygon(100% 0, 0 55%, 100% 100%); border-radius: 0 6px 12px 0; }
  .env-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: #f2b0bf; clip-path: polygon(0 100%, 50% 0, 100% 100%); z-index: 2; pointer-events: none; border-radius: 0 0 12px 12px; }
  .flap { position: absolute; top: 0; left: 0; width: 100%; height: 58%; background: #e9899d; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; z-index: 3; transition: transform .95s ease, z-index 0s .45s; }
  .envelope.open .flap { transform: rotateX(180deg); z-index: 0; }
  .seal { position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%); z-index: 4; font-size: 2rem; color: var(--red); pointer-events: none; transition: opacity .4s; }
  .envelope.open .seal { opacity: 0; }

  .btn { border: none; border-radius: 999px; padding: 13px 32px; font-size: 1.1rem; font-weight: 700; background: var(--red); color: var(--white); box-shadow: 0 8px 18px rgba(209,73,95,.35); transition: transform .2s; }
  .btn:hover { transform: translateY(-2px) scale(1.03); }
  .btn.pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(209,73,95,.5); } 50% { box-shadow: 0 0 0 14px rgba(209,73,95,0); } }
  .btn.soft { background: var(--white); color: var(--red); box-shadow: 0 6px 14px rgba(209,73,95,.18); }
  .btn:disabled { opacity: .6; cursor: default; }

  /* ===== LETTER ===== */
  #letterView { width: 100%; max-width: 620px; opacity: 0; transform: translateY(24px); transition: opacity .9s, transform .9s; padding-bottom: 150px; }
  #letterView.show { opacity: 1; transform: none; }
  .paper {
    position: relative; background-color: var(--cream); border-radius: 22px; padding: clamp(24px, 6vw, 46px) clamp(22px, 6vw, 46px) 56px;
    box-shadow: 0 22px 46px rgba(140,60,80,.22), inset 0 0 0 1px rgba(209,73,95,.12);
    background-image: repeating-linear-gradient(transparent 0 35px, rgba(209,73,95,.09) 35px 36px),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }
  .paper h2 { font-family: var(--script); color: var(--red); font-size: clamp(2rem, 7vw, 2.7rem); margin-bottom: 12px; }
  #letterText { font-family: var(--hand); font-size: clamp(1.45rem, 4.8vw, 1.8rem); line-height: 36px; white-space: pre-wrap; min-height: 150px; }
  .typing::after { content: "|"; color: var(--red); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .signature { font-family: var(--script); font-size: 2rem; color: var(--red); text-align: right; margin-top: 16px; opacity: 0; transition: opacity 1.2s; }
  .signature.show { opacity: 1; }
  .photos { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin-top: 26px; }
  .polaroid { background: #fff; padding: 8px 8px 4px; border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,.15); width: min(150px, 40vw); }
  .polaroid:nth-child(odd) { rotate: -4deg; } .polaroid:nth-child(even) { rotate: 3deg; }
  .polaroid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 3px; }
  .polaroid figcaption { text-align: center; font-family: var(--hand); font-size: 1.2rem; padding: 3px 0; }
  .corner { position: absolute; bottom: -8px; height: 84px; pointer-events: none; z-index: 2; }
  .corner.l { left: 4px; } .corner.r { right: 4px; }

  .surprise { margin-top: 24px; text-align: center; background: #fff; border: 2px dashed var(--blush-deep); border-radius: 18px; padding: 16px 18px 20px; animation: pop .7s ease; }
  .surprise-img { display: block; width: min(190px, 62%); height: auto; margin: 0 auto 10px; border-radius: 16px; }
  .surprise p { font-family: var(--hand); font-size: 1.7rem; line-height: 1.2; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 26px; }
  .actions .btn { font-size: 1rem; padding: 11px 22px; }

  /* ===== MUSIC PLAYER ===== */
  .player { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.88); backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 8px 6px 8px; box-shadow: 0 6px 16px rgba(209,73,95,.22); max-width: calc(100vw - 20px); }
  .record { width: 38px; height: 38px; flex: none; border-radius: 50%; background: radial-gradient(circle, var(--blush) 0 16%, #4a2a33 17% 100%); position: relative; }
  .record::after { content: "♪"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--blush-deep); font-size: .8rem; transform: translate(10px, -9px); }
  .record.spin { animation: spin 3.5s linear infinite; }
  @keyframes spin { to { rotate: 360deg; } }
  .player .info { line-height: 1.15; min-width: 0; }
  .player b { display: block; font-size: .95rem; } .player small { font-size: .75rem; opacity: .8; display: block; }
  .player button { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--red); color: #fff; font-size: .9rem; }

  @media (max-width: 560px) { .garden .plant:nth-child(n+6) { display: none; } .side-flower.l { left: -40px; } .side-flower.r { right: -40px; } .side-flower { height: 120px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<!-- One reusable flower shape (6 soft petals + golden center). Colored through CSS "color". -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bloom" viewBox="-50 -50 100 100">
      <g fill="currentColor" stroke="#fff" stroke-opacity=".6" stroke-width="1">
        <ellipse cx="0" cy="-24" rx="14" ry="25"/>
        <ellipse cx="0" cy="-24" rx="14" ry="25" transform="rotate(60)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="25" transform="rotate(120)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="25" transform="rotate(180)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="25" transform="rotate(240)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="25" transform="rotate(300)"/>
      </g>
      <circle r="9" fill="#f4cf78"/><circle r="4" fill="#e8b24f"/>
    </symbol>
  </defs>
</svg>

<div id="petals"></div>
<span class="sparkle" style="top:14%;left:9%">✦</span>
<span class="sparkle" style="top:24%;right:11%;animation-delay:1s">✧</span>
<span class="sparkle" style="top:46%;left:5%;animation-delay:2s">✧</span>
<span class="sparkle" style="top:60%;right:6%;animation-delay:.5s">✦</span>

<div class="garden" id="garden"></div>

<!-- Music player -->
<div class="player" id="player">
  <div class="record" id="record"></div>
  <div class="info"><b>love.</b><small id="artist">wave to earth</small></div>
  <button id="musicBtn" aria-label="Play music">▶</button>
</div>

<main>
  <!-- ===== OPENING SCREEN ===== -->
  <section id="intro">
    <h1>A little something for you</h1>
    <p class="sub" id="introSub"></p>
    <div class="envelope-wrap">
      <div class="side-flower l" id="sideL"></div>
      <div class="side-flower r" id="sideR"></div>
      <div class="envelope" id="envelope" tabindex="0" role="button" aria-label="Open the envelope">
        <div class="env-letter">for you ♡</div>
        <div class="env-front"></div>
        <div class="env-bottom"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>
    </div>
    <button class="btn pulse" id="openBtn">Open Me</button>
    <button class="btn pulse hidden" id="readBtn">Read My Letter</button>
  </section>

  <!-- ===== LETTER ===== -->
  <section id="letterView" class="hidden">
    <article class="paper">
      <h2 id="greeting"></h2>
      <p id="letterText"></p>
      <p class="signature" id="signature"></p>
      <div class="photos" id="photos"></div>
      <div class="surprise hidden" id="surprise">
        <img class="surprise-img" src="photo3.jpg" alt="Surprise">
        <p id="surpriseText"></p>
      </div>
      <div class="corner l" id="cornerL"></div>
      <div class="corner r" id="cornerR"></div>
    </article>
    <div class="actions">
      <button class="btn" id="surpriseBtn">Open a Surprise ♡</button>
      <button class="btn soft" id="replayBtn">Read Again</button>
      <button class="btn soft" id="closeBtn">Close Letter</button>
    </div>
  </section>
</main>

<script>
/* =====================================================
   ✏️ CUSTOMIZE HERE — change these and you're done
   ===================================================== */
const RECIPIENT = "Baby";
const SENDER    = "Your Baby";
const INTRO_SUB = "Tap the envelope when you're ready.";

// Your letter. A blank line = a new paragraph.
const MESSAGE =
`Good morning babyyy, happy 2nd monthsary po

I'm so happy and thankful that we're still here, loving each other, hehe. Kasi pagdating ng Oct-Nov, may nangyayari d maganda, and after ng mga bagay na nangyayari satin,wag napo sana mangyari ulit I want to say that iloveyou always. Thank you for staying. I'm so lucky that I have such a beautiful gf like you and for how you treat, love, and care for me now. Lagi ako na eexcite kausapin ka kahit araw araw pa yun, hindi ako mananawa sayo, baby. I wouldn't easily give up on you like before.

And baby, ang ganda mo palagi, may makeup man or wala. For me, you're always beautiful, and I hope you know that. Iba na yung saya ko na nararamdaman sayo, baby. You make me feel things that I can't even explain sometimes, hehe. And ang sweet sweet mo din, baby. I really appreciate all the little things you do for me. You don't know how happy you make me just by talking to me, giving me attention, or showing me your love. Lagi akong natutuwa kapag ikaw kausap ko, and kahit paulit ulit tayong mag usap hindi ako mananawa sayo baby i only want you

Gusto kitang makita at makasama, I hope na matuloy tayo sa December. Sana kahit may mga problems and misunderstandings ay wag tayo susuko, baby. Breaking up is not the solution. Maiintindihan ko if want mo ng space. Wala na akong ibang gusto mahalin, ikaw lang, baby. I hope you realize that I don't want to lose you again. I hope we can put aside our pride and ego when it comes to arguments para mas madali natin maayos. Let your unsaid thoughts out and tell me. I'll listen and understand them. You don't have to keep everything to yourself, baby. I want you to feel comfortable telling me what you feel, what bothers you, and what makes you happy. I want us to understand each other better and learn from our mistakes together.

I wish that we could just stay here, no matter what happens and we always choose to understand each other and fix things together. I want to be someone you can run to when you're tired, someone you can share your problems with.

I'm so proud of you, baby, even sa mga small achievements mo. Galing-galing mo palagi. Don't be too hard on yourself, okay? Don't skip meals, kain ka palagi, wag papabayaan sa sarili, baby. I hope you always remember that you deserve to be loved, appreciated, and taken care of, too. I'll always be here to listen to you and support you. Baby, sana wag lumayo loob mo sakin, okay? I'm also doing my best to understand you more, lalo na kapag nagagalit ka. I'm still learning how to handle things better and how to react in a way na hindi ka masasaktan or mapaparamdam sayo na hindi kita naiintindihan. Ayoko na pababayaan lang kita kapag may problema ka or kapag hindi okay yung nararamdaman mo.

Thank you for being part of my life, baby. Thank you for making me smile, for being sweet to me, and for motivating me. I'm really happy that it's you. If I could choose again, I would still choose you. Happy 2nd monthsary again, baby! Sana matupad natin yung mga plano natin together, especially sa December, hehe. Always take care of yourself for me, okay? I'm so lucky to have you

I love you so muchhh, babyyy! Happy monthsary ulit, my beautiful babyy`;

// Hidden surprise (shows with your picture, photo3.jpg)
const SURPRISE = "Psst... see you in December, baby. I love you, always. ♡";

// Photos: use image links or files like "photos/us.jpg". Use [] for no photos.
const PHOTOS = [
  { src: "photo1.jpg", caption: "My pretty baby" },
  { src: "photo2.jpg", caption: "My pretty baby" }
];

// Song file. Put Love.mp3 in the SAME folder as index.html (you provide it).
// The name must match your file EXACTLY, including the capital L.
const MUSIC_FILE = "Love.mp3";

const TYPING_SPEED = 12;   // ms per letter (lower = faster). Tap the letter to show it all at once.
const FLOWER_COLORS = ["#f4a8b8", "#ffffff", "#e8788f", "#fbd0da", "#f7b9c6"];
/* ===================== END CUSTOMIZE ===================== */


/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
function placeholder(symbol, bg) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='${bg}'/><text x='150' y='190' font-size='120' text-anchor='middle' fill='#d1495f'>${symbol}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* Builds one flower with stem and leaves as an inline SVG string */
function plant(color, delay, extra) {
  return `<svg class="plant ${extra || ""}" viewBox="0 0 100 220" style="--d:${delay}s;color:${color}" aria-hidden="true">
    <path d="M50 220 C50 170 44 130 50 78" stroke="#8fae8b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M48 175 C20 165 12 140 16 132 C40 132 48 154 48 175Z" fill="#a9c5a3"/>
    <path d="M50 145 C80 137 88 113 84 105 C60 107 50 125 50 145Z" fill="#8fae8b"/>
    <use class="head" href="#bloom" x="14" y="12" width="72" height="72"/>
  </svg>`;
}

/* ---------- Place flowers ---------- */
$("garden").innerHTML = Array.from({ length: 9 }, (_, i) => plant(FLOWER_COLORS[i % 5], (i * 0.25).toFixed(2))).join("");
$("sideL").innerHTML = plant(FLOWER_COLORS[0], 0.1);
$("sideR").innerHTML = plant(FLOWER_COLORS[2], 0.3);
$("cornerL").innerHTML = plant(FLOWER_COLORS[1], 0, "still");
$("cornerR").innerHTML = plant(FLOWER_COLORS[3], 0, "still");

/* ---------- Fill in text ---------- */
$("introSub").textContent = INTRO_SUB;
$("greeting").textContent = "Dear " + RECIPIENT + ",";
$("signature").textContent = "Forever yours, " + SENDER + " ♥";
$("surpriseText").textContent = SURPRISE;
PHOTOS.forEach((p) => {
  const fig = document.createElement("figure");
  fig.className = "polaroid";
  fig.innerHTML = "<img><figcaption></figcaption>";
  fig.querySelector("img").src = p.src;
  fig.querySelector("img").alt = p.caption || "Photo";
  fig.querySelector("figcaption").textContent = p.caption || "";
  $("photos").appendChild(fig);
});

/* ---------- Falling petals and rising hearts ---------- */
function spawnPetal() {
  const el = document.createElement("span");
  el.className = "petal";
  const size = 9 + Math.random() * 10;
  el.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size * 1.2}px;animation-duration:${9 + Math.random() * 6}s;` +
    `background:${Math.random() > 0.5 ? "#efa7b6" : "#fbd0da"}`;
  $("petals").appendChild(el);
  setTimeout(() => el.remove(), 16000);
}
function spawnHeart() {
  const el = document.createElement("span");
  el.className = "heart";
  el.textContent = "♥";
  el.style.cssText = `left:${Math.random() * 100}%;font-size:${12 + Math.random() * 14}px;animation-duration:${8 + Math.random() * 4}s`;
  $("petals").appendChild(el);
  setTimeout(() => el.remove(), 12500);
}
setInterval(spawnPetal, 1500);
setInterval(spawnHeart, 3500);
for (let i = 0; i < 4; i++) setTimeout(spawnPetal, i * 400);
function burst(n) { for (let i = 0; i < n; i++) setTimeout(i % 3 ? spawnPetal : spawnHeart, i * 110); }

/* ---------- Music player ---------- */
const audio = new Audio();
audio.loop = true;
audio.src = MUSIC_FILE;
let audioMissing = false;
audio.addEventListener("error", () => {             // file not found → no crash, just a hint
  audioMissing = true;
  $("artist").textContent = "add " + MUSIC_FILE + " next to index.html";
  $("record").classList.remove("spin");
  $("musicBtn").textContent = "▶";
});
function setPlayingUI(on) {
  $("record").classList.toggle("spin", on);
  $("musicBtn").textContent = on ? "❚❚" : "▶";
  $("musicBtn").setAttribute("aria-label", on ? "Pause music" : "Play music");
}
function playMusic() {
  if (audioMissing) return;
  const p = audio.play();
  if (p && p.then) p.then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
}
$("musicBtn").addEventListener("click", () => {
  if (audioMissing) { $("artist").textContent = "add " + MUSIC_FILE + " next to index.html"; return; }
  if (audio.paused) playMusic(); else { audio.pause(); setPlayingUI(false); }
});

/* ---------- Step 1: open the envelope ---------- */
const envelope = $("envelope");
let isOpening = false;                              // stops repeat clicks from breaking the animation
function openEnvelope() {
  if (isOpening) return;
  isOpening = true;
  envelope.classList.add("open");
  document.body.classList.add("bloom");             // flowers bloom
  $("openBtn").classList.add("hidden");
  playMusic();                                      // allowed: this runs from a click
  burst(14);
  setTimeout(() => $("readBtn").classList.remove("hidden"), 1500);
}
$("openBtn").addEventListener("click", openEnvelope);
envelope.addEventListener("click", openEnvelope);
envelope.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); } });

/* ---------- Step 2: show the letter ---------- */
$("readBtn").addEventListener("click", () => {
  $("intro").classList.add("hidden");
  $("letterView").classList.remove("hidden");
  requestAnimationFrame(() => requestAnimationFrame(() => $("letterView").classList.add("show")));
  window.scrollTo(0, 0);
  typeLetter();
});

/* ---------- Typing animation ---------- */
let typingTimer = null;
function typeLetter() {
  clearInterval(typingTimer);
  const box = $("letterText");
  box.textContent = "";
  box.classList.add("typing");
  $("signature").classList.remove("show");
  $("surpriseBtn").classList.remove("pulse");
  let i = 0;
  const finish = () => {
    clearInterval(typingTimer);
    box.textContent = MESSAGE;
    box.classList.remove("typing");
    $("signature").classList.add("show");
    $("surpriseBtn").classList.add("pulse");        // hint: the surprise is ready
    burst(8);
  };
  skipTyping = finish;
  typingTimer = setInterval(() => {
    box.textContent = MESSAGE.slice(0, ++i);
    if (i >= MESSAGE.length) finish();
  }, TYPING_SPEED);
}
let skipTyping = null;                              // tap the letter while it types to show everything
$("letterText").addEventListener("click", () => {
  if ($("letterText").classList.contains("typing") && skipTyping) skipTyping();
});
$("replayBtn").addEventListener("click", () => { $("surprise").classList.add("hidden"); typeLetter(); });

/* ---------- Hidden surprise ---------- */
$("surpriseBtn").addEventListener("click", () => {
  const box = $("surprise");
  box.classList.remove("hidden");
  box.style.animation = "none"; void box.offsetHeight; box.style.animation = "";   // replay pop
  box.scrollIntoView({ behavior: "smooth", block: "center" });
  burst(16);
});

/* ---------- Close letter ---------- */
$("closeBtn").addEventListener("click", () => {
  clearInterval(typingTimer);
  $("letterView").classList.remove("show");
  $("letterView").classList.add("hidden");
  $("surprise").classList.add("hidden");
  envelope.classList.remove("open");
  document.body.classList.remove("bloom");
  $("readBtn").classList.add("hidden");
  $("openBtn").classList.remove("hidden");
  $("intro").classList.remove("hidden");
  isOpening = false;                                // envelope can be opened again
});
</script>
</body>
</html>
